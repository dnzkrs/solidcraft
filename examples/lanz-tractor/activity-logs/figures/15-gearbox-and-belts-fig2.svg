<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-size="13"><style>svg{--ink:#16212B;--muted:#5A6B76;--line:#D4DDDA;--accent:#1D6A86;background:#FAFBFB;font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#DCE6E9;--muted:#8FA2AA;--line:#28383F;--accent:#5BB4D3;background:#101A1E}}</style>
<text x="20" y="24" fill="var(--ink)" font-weight="bold" font-size="15">4-17: the cluster gear, built prisms first</text>
<polygon points="144.0,270.0 144.0,126.0 180.0,126.0 180.0,270.0" fill="var(--line)" fill-opacity="1" stroke="var(--ink)"/>
<polygon points="144.0,270.0 144.0,414.0 180.0,414.0 180.0,270.0" fill="var(--line)" fill-opacity="1" stroke="var(--ink)"/>
<polygon points="180.0,270.0 180.0,216.0 225.0,216.0 225.0,270.0" fill="var(--line)" fill-opacity="1" stroke="var(--ink)"/>
<polygon points="180.0,270.0 180.0,324.0 225.0,324.0 225.0,270.0" fill="var(--line)" fill-opacity="1" stroke="var(--ink)"/>
<polygon points="126.0,270.0 126.0,198.0 148.5,198.0 148.5,270.0" fill="var(--accent)" fill-opacity="0.35" stroke="var(--ink)"/>
<polygon points="126.0,270.0 126.0,342.0 148.5,342.0 148.5,270.0" fill="var(--accent)" fill-opacity="0.35" stroke="var(--ink)"/>
<polygon points="220.5,270.0 220.5,234.4 252.0,234.4 252.0,270.0" fill="var(--accent)" fill-opacity="0.35" stroke="var(--ink)"/>
<polygon points="220.5,270.0 220.5,305.6 252.0,305.6 252.0,270.0" fill="var(--accent)" fill-opacity="0.35" stroke="var(--ink)"/>
<polygon points="117.0,288.0 117.0,252.0 261.0,252.0 261.0,288.0" fill="none" stroke="var(--accent)" stroke-dasharray="5 3"/>
<line x1="99" y1="270.0" x2="279" y2="270.0" stroke="var(--muted)" stroke-dasharray="8 3 2 3"/>
<text x="330" y="70" fill="var(--ink)">1. 30 tooth gear prism, solid (grey)</text>
<text x="330" y="92" fill="var(--ink)">2. 10 tooth pinion prism joined</text>
<text x="330" y="114" fill="var(--accent)">3. hub and collar (blue) reach 0.5</text>
<text x="330" y="136" fill="var(--accent)">   into the prisms, never just touch</text>
<text x="330" y="158" fill="var(--accent)">4. the Ø4 bore (dashed) drilled last</text>
<text x="330" y="180" fill="var(--ink)"></text>
<text x="330" y="202" fill="var(--muted)">prism faces touching a round hub, or</text>
<text x="330" y="224" fill="var(--muted)">a bore circle on a bored core: the</text>
<text x="330" y="246" fill="var(--muted)">join fails (planar faces only)</text>
</svg>