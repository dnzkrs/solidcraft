<svg width="720" height="340" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-size="13"><style>svg{--ink:#16212B;--muted:#5A6B76;--line:#D4DDDA;--accent:#1D6A86;background:#FAFBFB;font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#DCE6E9;--muted:#8FA2AA;--line:#28383F;--accent:#5BB4D3;background:#101A1E}}</style>
<text x="20" y="24" fill="var(--ink)" font-weight="bold" font-size="15">2-24: the twist is a loft started 1 mm inside the plate</text>
<text x="20" y="54" fill="var(--muted)">top view (X, Y)</text>
<polygon points="60.0,178.5 168.0,178.5 168.0,61.5 60.0,61.5" fill="var(--line)" stroke="var(--ink)"/>
<polygon points="159.0,157.7 312.0,129.0 312.0,111.0 159.0,82.3" fill="var(--accent)" fill-opacity="0.35" stroke="var(--accent)"/>
