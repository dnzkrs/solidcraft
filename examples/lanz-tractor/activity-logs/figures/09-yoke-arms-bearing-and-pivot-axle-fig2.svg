<line x1="168" y1="60" x2="168" y2="180" stroke="var(--muted)" stroke-dasharray="4 3"/>
<text x="20" y="204" fill="var(--muted)">side view (X, Z)</text>
<polygon points="60.0,279.0 168.0,279.0 168.0,261.0 60.0,261.0" fill="var(--line)" stroke="var(--ink)"/>
<polygon points="159.0,277.3 312.0,306.0 312.0,234.0 159.0,262.7" fill="var(--accent)" fill-opacity="0.35" stroke="var(--accent)"/>
<polygon points="312.0,306.0 357.0,306.0 357.0,234.0 312.0,234.0" fill="var(--line)" stroke="var(--ink)"/>
<line x1="168" y1="210" x2="168" y2="330" stroke="var(--muted)" stroke-dasharray="4 3"/>
<text x="420" y="70" fill="var(--ink)">plate 12 x 13 x 2 (grey, left), tab right</text>
<text x="420" y="92" fill="var(--accent)">loft (blue): 8 x 2 at X = 6 → 2 x 8 at X = 22</text>
<text x="420" y="114" fill="var(--accent)">started at X = 5 with 8.375 x 1.625,</text>
<text x="420" y="136" fill="var(--accent)">the same planes extended back</text>
