<text x="420" y="180" fill="var(--ink)"></text>
<text x="420" y="202" fill="var(--ink)">touching at X = 6: a separation retry,</text>
<text x="420" y="224" fill="var(--ink)">or +0.98 mm³ with no warning</text>
<text x="420" y="246" fill="var(--ink)">crossing from X = 5: exact, 745.2 mm³</text>
