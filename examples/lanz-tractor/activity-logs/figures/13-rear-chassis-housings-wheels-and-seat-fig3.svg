<svg width="560" height="340" viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-size="13"><style>svg{--ink:#16212B;--muted:#5A6B76;--line:#D4DDDA;--accent:#1D6A86;background:#FAFBFB;font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#DCE6E9;--muted:#8FA2AA;--line:#28383F;--accent:#5BB4D3;background:#101A1E}}</style>
<text x="20" y="24" fill="var(--ink)" font-weight="bold" font-size="15">3-19: a hole ending in the plane of the notch floor</text>
<polygon points="40.0,320.0 284.8,320.0 284.8,292.8 257.6,265.6 186.2,265.6 172.6,252.0 172.6,42.9 40.0,42.9 40.0,153.4 60.4,187.4 99.5,187.4 99.5,292.8 40.0,292.8" fill="var(--line)" stroke="var(--ink)" stroke-width="1.5"/>
