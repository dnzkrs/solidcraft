<svg width="720" height="310" viewBox="0 0 720 310" xmlns="http://www.w3.org/2000/svg" font-size="13"><style>svg{--ink:#16212B;--muted:#5A6B76;--line:#D4DDDA;--accent:#1D6A86;background:#FAFBFB;font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#DCE6E9;--muted:#8FA2AA;--line:#28383F;--accent:#5BB4D3;background:#101A1E}}</style>
<text x="20" y="24" fill="var(--ink)" font-weight="bold" font-size="15">A symmetric extrude: same parameter, two readings</text>
<text x="40" y="60" fill="var(--ink)">before: distance = W/2 per side</text>
<line x1="170" y1="75" x2="170" y2="235" stroke="var(--muted)" stroke-dasharray="6 4"/>
<rect x="110" y="95" width="120" height="110" fill="var(--accent)" fill-opacity="0.35" stroke="var(--ink)"/>
<text x="130" y="255" fill="var(--muted)">sketch plane</text>
<text x="110" y="225" fill="var(--ink)">W</text>
<text x="380" y="60" fill="var(--ink)">on main: distance = total thickness</text>
<line x1="510" y1="75" x2="510" y2="235" stroke="var(--muted)" stroke-dasharray="6 4"/>
<rect x="480" y="95" width="60" height="110" fill="var(--muted)" fill-opacity="0.35" stroke="var(--ink)"/>
<text x="470" y="255" fill="var(--muted)">sketch plane</text>
<text x="480" y="225" fill="var(--ink)">W/2</text>
<text x="40" y="290" fill="var(--muted)">distance=W / 2 was written for the old per-side reading: on main the same call builds half the width</text>
</svg>