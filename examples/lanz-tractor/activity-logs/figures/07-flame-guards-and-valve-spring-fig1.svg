<svg width="720" height="260" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-size="13"><style>svg{--ink:#16212B;--muted:#5A6B76;--line:#D4DDDA;--accent:#1D6A86;background:#FAFBFB;font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#DCE6E9;--muted:#8FA2AA;--line:#28383F;--accent:#5BB4D3;background:#101A1E}}</style>
<text x="20" y="25" fill="var(--ink)" font-weight="bold" font-size="15">1-40: a sharp 78° bend built as one section, then trimmed</text>
<polygon points="40,200 300,200 307,193 270,55 258,57 292,188 40,188" fill="var(--line)" stroke="var(--ink)" stroke-width="1.5"/>
<polygon points="292,200 307,200 300,188 292,188" fill="var(--accent)" opacity="0.6"/>
<text x="40" y="225" fill="var(--muted)">flat leg (perforated), Z = 0 … 1.5</text>
<text x="200" y="60" fill="var(--muted)">folded leg (R28)</text>
<text x="230" y="235" fill="var(--accent)">mitred outer corner</text>
<g fill="var(--ink)"><text x="400" y="70" font-weight="bold">Steps</text>
<text x="400" y="92">1. Extrude the section across Y = −26 … 24</text>
<text x="400" y="112">2. Perforations (26 × Ø3.5)</text>
<text x="400" y="132">3. Z-cuts trim the flat leg's outline</text>
<text x="400" y="152">4. Y-cut clears the corner beside the tab</text>
<text x="400" y="172">5. Cut along the leg's normal: rectangle</text>
<text x="400" y="190">    minus the R28 circle trims the end</text>
<text x="400" y="210">6. Ø4 holes through the folded leg</text></g>
</svg>