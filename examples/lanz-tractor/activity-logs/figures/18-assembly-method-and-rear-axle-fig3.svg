<svg width="720" height="220" viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" font-size="13"><style>svg{--ink:#16212B;--muted:#5A6B76;--line:#D4DDDA;--accent:#1D6A86;background:#FAFBFB;font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#DCE6E9;--muted:#8FA2AA;--line:#28383F;--accent:#5BB4D3;background:#101A1E}}</style>
<text x="20" y="24" fill="var(--ink)" font-weight="bold" font-size="15">occurrence.move composes; a reused occurrence starts at the first one</text>
<text x="30" y="70" fill="var(--muted)">asked</text>
<text x="200" y="70" fill="var(--ink)">3-07:2 at Z 62</text>
<text x="370" y="70" fill="var(--ink)">3-13:2 at Z 88.5</text>
<text x="540" y="70" fill="var(--ink)">3-14:2 at Z 131.5</text>
<text x="30" y="100" fill="var(--muted)">got (M·F)</text>
<text x="200" y="100" fill="var(--ink)">Z 64 = 62 + 2</text>
<text x="370" y="100" fill="var(--ink)">Z 28 = 88.5 - 60.5</text>
<text x="540" y="100" fill="var(--ink)">Z 216 = 131.5 + 84.5</text>
<text x="30" y="130" fill="var(--accent)">fix</text>
<text x="200" y="130" fill="var(--accent)">move by D·F⁻¹</text>
<text x="370" y="130" fill="var(--accent)"></text>
<text x="540" y="130" fill="var(--accent)"></text>
<text x="30" y="175" fill="var(--muted)">F = placement of the part's first occurrence, D = the wanted placement:</text>
<text x="30" y="197" fill="var(--ink)">R_move = R_D R_Fᵀ,  t_move = t_D − R_move t_F</text>
</svg>